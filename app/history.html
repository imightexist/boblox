        function softRedirect(a){
            document.getElementById("history-throbber").style.display=""
            let fetchUrl = new URL(a)
            fetchUrl.searchParams.set("contentOnly","true")
            fetch(fetchUrl.toString(),{method:"GET"}).then(function(res){
                if (res.status!=400){
                    let resUrl = new URL(res.url)
                    resUrl.searchParams.delete("contentOnly")
                    resUrl.searchParams.delete("contentOnlya")
                    resUrl = resUrl.toString()
                    //console.log(resUrl)
                    //console.log(3414325234)
                    res.text().then(function(body){
                        //console.log(body)
                        document.getElementById("content").innerHTML=body
                        document.getElementById("header").setAttribute("style","")
                        let signUpUrl = new URL(document.querySelector(".rbx-navbar-signup").href)
                        signUpUrl.searchParams.set("returnUrl",location.pathname)
                        document.querySelector(".rbx-navbar-signup").href=signUpUrl.toString()
                        //document.getElementById("footer-note").innerHTML="BOBLOX is not affiliated with Roblox Corporation. Accessing this site signifies your acceptance of the Terms and Conditions unless otherwise stated."
                        if (document.getElementById("content").querySelector("script")!=undefined){
                            eval(document.getElementById("content").querySelector("script").innerHTML)
                        }
                        document.getElementById("content").querySelectorAll("a").forEach(softNav)
                        document.getElementById("history-throbber").style.display="none"
                        //clearInterval(historyThrob)
                        history.pushState(body,"",resUrl)
                    }).catch(function(err){
                        //console.log(err)
                        location.href=a
                    })
                }else{
                    location.href=a
                }
            })
        }
        function softRefresh(){
            softRedirect(location.href)

        function softNav(a){
            //console.log(a.innerHTML)
            if (a.hasAttribute("href")){
                if (a.href.startsWith(location.origin)){
                    //console.log(a.href)
                    if (location.href.endsWith("#")){
                        if (location.href==a.href){
                            return
                        }
                    }else if (location.href+"#"==a.href){
                        return
                    }
                    if (a.hasAttribute("target")){
                        if (a.getAttribute("target")=="_top"){
                            a.addEventListener("click",function(e){
                                e.preventDefault();
                                top.softRedirect(a.href)
                            })
                        }
                        return
                    }
                    a.addEventListener("click",function(e){
                        if (isBot){

        addEventListener("popstate",function(e){
            if (e.state==null){
                return
            }
            //history.pushState(document.getElementById("content").innerHTML,"",a.href)
            document.getElementById("content").innerHTML=e.state
            document.getElementById("header").setAttribute("style","")

            signUpUrl.searchParams.set("returnUrl",location.pathname)

            if (document.getElementById("content").querySelector("script")!=undefined){
                eval(document.getElementById("content").querySelector("script").innerHTML)
            }

        })
